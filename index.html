<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Elite Refrigeration Services Inc.</title>
  <meta name="robots" content="noindex">
  <!-- Router: each Google Ads campaign should link directly to /refrigeration/ or /hvac/.
       This page only forwards stray visits (with their query string intact) to the matching campaign page. -->
  <script>
    (function () {
      var p = new URLSearchParams(location.search);
      var s = [p.get('service'), p.get('utm_campaign'), p.get('utm_term'), p.get('utm_content')].join(' ').toLowerCase();
      var hvac = /hvac|heat[\s-]?pump|ductless|mini[\s-]?split|air[\s-]?cond|\bac\b|heating|furnace|rooftop/.test(s);
      var refr = /refrig|cooler|freezer|walk-?in|cold[\s-]?storage/.test(s);
      var target = (hvac && !refr) ? 'hvac/' : 'refrigeration/';
      location.replace(target + location.search);
    })();
  </script>
  <meta http-equiv="refresh" content="0; url=refrigeration/">
</head>
<body>
  <p>Continue to <a href="refrigeration/">Commercial Refrigeration</a> or <a href="hvac/">Commercial HVAC</a>.</p>
</body>
</html>
